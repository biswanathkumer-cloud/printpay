<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintPay Desktop Print Station</title><link rel="stylesheet" href="/app.css"><style>.desktop{max-width:1100px;margin:auto;padding:22px 14px}.job{border:1px solid #dbe3f0;border-radius:18px;padding:16px;margin:12px 0;background:#fff}.ok{color:#15803d}.key{font-family:monospace}.big{font-size:18px;font-weight:800}</style></head><body><header><div class="brand"><span class="brand-mark">🖨️</span><b>PrintPay Desktop Print Station</b></div><a href="/owner.html">Owner</a></header><main class="desktop"><section class="card"><h2>🖥️ Desktop Print Station</h2><p>এই page-টি দোকানের computer-এ খোলা রাখুন। Owner payment receive করলে নতুন print job এখানে আসবে।</p><label>Desktop Key<input id="key" class="key" placeholder="Owner panel থেকে Desktop Key দিন"></label><button id="save">Save & Start</button><button id="stop" class="secondary">Stop</button><p id="state" class="hint"></p></section><section class="card"><div class="top"><h2>🧾 Print Queue</h2><button id="refresh">Refresh</button></div><div id="jobs"></div></section></main><script>
const $=i=>document.getElementById(i);let timer=null,printing=new Set();$('key').value=localStorage.printpayDesktopKey||'';function key(){return $('key').value.trim()}async function poll(){if(!key())return;$('state').textContent='Checking print queue…';const r=await fetch('/api/desktop/jobs',{headers:{'x-desktop-key':key()}});if(!r.ok){$('state').textContent='Desktop Key ভুল বা Owner settings-এ key সেট করুন।';return}const d=await r.json();$('state').textContent='Connected • '+new Date().toLocaleTimeString();render(d.jobs||[])}function render(a){$('jobs').innerHTML=a.length?a.map(j=>`<div class="job"><div class="big">${j.id} — ₹${(j.amount_paise/100).toFixed(2)}</div><div>${j.customer_name} • ${j.mobile} • ${j.print_mode} • ${j.copies} copies</div><div style="margin-top:8px">📄 ${j.file_name}</div><button onclick="printJob('${j.id}','${encodeURIComponent(j.file_key)}')">🖨️ Print Now</button></div>`).join(''):'<p class="hint">No paid print jobs.</p>'}window.printJob=async(id,keyEncoded)=>{if(printing.has(id))return;printing.add(id);const r=await fetch('/api/desktop/file?key='+keyEncoded,{headers:{'x-desktop-key':key()}});if(!r.ok){alert('File download failed');printing.delete(id);return}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PrintPay-'+id+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);alert('File download হয়েছে। Windows Desktop Agent থাকলে automatic print হবে; না থাকলে downloaded file থেকে Print করুন।');printing.delete(id)};$('save').onclick=()=>{localStorage.printpayDesktopKey=key();clearInterval(timer);timer=setInterval(poll,3000);poll()};$('stop').onclick=()=>{clearInterval(timer);$('state').textContent='Stopped'};$('refresh').onclick=poll;if(key()){timer=setInterval(poll,3000);poll()}
</script></body></html>

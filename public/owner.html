<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintPay Owner</title><link rel="stylesheet" href="/app.css"><style>.owner{max-width:1050px;margin:auto;padding:25px 14px}.login{max-width:430px;margin:70px auto}.tablewrap{overflow:auto}.orders{width:100%;border-collapse:collapse;min-width:950px}.orders th,.orders td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:12px}.orders th{background:#eef2ff;color:#312e81}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.danger{background:#dc2626}.save{background:linear-gradient(100deg,#059669,#0d9488)}</style></head><body><header><div class="brand"><span class="brand-mark">🛡️</span><b>PrintPay Owner</b></div><a href="/">Customer Portal</a></header><main class="owner"><section id="loginCard" class="card login"><h2>🔐 Owner Login</h2><label>Username<input id="u" value="owner"></label><label style="margin-top:10px">Password<input id="p" type="password"></label><button id="login" style="margin-top:12px;width:100%">Login</button><p id="msg" class="hint"></p></section><div id="panel" class="hidden"><section class="card"><div class="top"><h2>⚙️ Live Settings</h2><button id="logout" class="danger">Logout</button></div><div class="grid2"><label>Business name<input id="business_name"></label><label>Logo URL<input id="logo_url"></label><label>B&W price / page<input id="price_bw" type="number"></label><label>Colour price / page<input id="price_color" type="number"></label><label>Delivery<input id="delivery" type="number"></label><label>Global discount %<input id="global_discount" type="number"></label><label>UPI QR image URL<input id="upi_qr"></label><label>1+ tier price<input id="tier_1" type="number"></label><label>5+ tier price<input id="tier_5" type="number"></label><label>10+ tier price<input id="tier_10" type="number"></label><label>25+ tier price<input id="tier_25" type="number"></label></div><button id="save" class="save" style="margin-top:14px;width:100%">💾 Save Live Settings</button></section><section class="card"><div class="top"><h2>🧾 All Purchases</h2><button id="refresh">Refresh</button></div><div class="tablewrap"><table class="orders"><thead><tr><th>Order ID</th><th>Customer</th><th>Mobile</th><th>Pages</th><th>Copies</th><th>Mode</th><th>Amount</th><th>Payment</th><th>Status</th><th>Date/Time</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table></div></section></div></main><script>const $=i=>document.getElementById(i);let s={};async function load(){const r=await fetch('/api/owner/settings');if(!r.ok){$('loginCard').classList.remove('hidden');$('panel').classList.add('hidden');return}s=await r.json();Object.keys(s).forEach(k=>{if($(k))$(k).value=s[k]});$('loginCard').classList.add('hidden');$('panel').classList.remove('hidden');orders()}$('login').onclick=async()=>{const r=await fetch('/api/owner/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});const d=await r.json();if(d.ok){$('msg').textContent='';load()}else $('msg').textContent=d.error||'Login failed'};$('save').onclick=async()=>{const b={};['business_name','logo_url','price_bw','price_color','delivery','global_discount','upi_qr','tier_1','tier_5','tier_10','tier_25'].forEach(k=>b[k]=$(k).value);const r=await fetch('/api/owner/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});alert(r.ok?'Saved':'Save failed');load()};async function orders(){const r=await fetch('/api/owner/orders');if(!r.ok)return;const a=await r.json();$('tbody').innerHTML=a.map(o=>`<tr><td>${o.id}</td><td>${o.customer_name}</td><td>${o.mobile}</td><td>${o.pages}</td><td>${o.copies}</td><td>${o.print_mode}</td><td>₹${(o.amount_paise/100).toFixed(2)}</td><td>${o.payment_method}</td><td><b>${o.payment_status}</b></td><td>${new Date(o.created_at).toLocaleString()}</td><td>${o.payment_method==='cash'&&o.payment_status!=='PAID'?`<button onclick="cashPaid('${o.id}',${o.amount_paise/100})">Payment Received</button>`:''}</td></tr>`).join('')}window.cashPaid=async(id,amount)=>{
  await fetch('/api/owner/cash-paid',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({order_id:id})});
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(`আপনি আপনার ${amount} টাকা সংগ্রহ করুন`);
    u.lang='bn-IN';u.rate=.9;u.pitch=1;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }
  orders();
};$('refresh').onclick=orders;$('logout').onclick=async()=>{await fetch('/api/owner/logout');location.reload()};load();</script></body></html>

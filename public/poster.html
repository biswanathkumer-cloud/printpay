<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintPay QR Poster</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f3ff}.poster{max-width:650px;margin:30px auto;background:#fff;border-radius:28px;padding:30px;text-align:center;box-shadow:0 20px 60px #0001}.qr{display:grid;place-items:center;margin:20px auto}.btn{padding:12px 18px;border:0;border-radius:12px;background:#5b4bdb;color:#fff;font-weight:800}</style></head><body><div class="poster"><img src="/printpay-logo.svg" width="90"><h1>📱 Scan QR to Print Documents</h1><p>১. QR scan করুন<br>২. Image / PDF upload করুন<br>৩. B&W / Colour নির্বাচন করুন<br>৪. Counter-এ টাকা দিন<br>৫. Payment Received হওয়ার পর Print Dialog খুলবে</p><div id="qr" class="qr"></div><button class="btn" onclick="print()">🖨️ Print / Save Poster</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>new QRCode(document.getElementById('qr'),{text:location.origin+'/',width:300,height:300});</script></body></html>

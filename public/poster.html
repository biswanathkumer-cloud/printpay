<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintPay Customer QR Poster</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{margin:0;background:#eef2ff;font-family:Arial,sans-serif}.poster{width:min(760px,92vw);margin:30px auto;background:#fff;border-radius:30px;padding:35px;text-align:center;box-shadow:0 15px 45px #0002}.brand{font-size:38px;font-weight:900;color:#4f46e5;display:flex;align-items:center;justify-content:center;gap:12px}.brand img{height:52px;max-width:160px}.qr{margin:25px auto;width:320px;min-height:320px;display:grid;place-items:center}.steps{font-size:23px;font-weight:800;line-height:1.7}.small{color:#475569;font-size:17px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{padding:13px 22px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:800;font-size:16px}button.alt{background:#0f766e}@media print{body{background:#fff}.poster{box-shadow:none;margin:0;width:auto}.actions{display:none}}
</style></head><body><div class="poster"><div class="brand"><img id="logo" src="/printpay-logo.svg" alt="PrintPay"><span id="brandText">PrintPay</span></div><h1>নিজে নিজে Document Print করুন</h1><div id="qr" class="qr"></div><div class="steps">📱 ১. QR Scan করুন<br>📄 ২. নিজের Document / PDF Upload করুন<br>🧾 ৩. Order পাঠিয়ে Counter-এ টাকা দিন<br>🖨️ ৪. টাকা নেওয়ার পর Print স্বয়ংক্রিয়ভাবে হবে</div><p class="small">আপনার মোবাইল থেকেই কাজ করুন — দোকানের computer-এ Print Station আপনার file print করবে।</p><div class="actions"><button onclick="window.print()">🖨️ Poster Print / Save PDF</button><button class="alt" onclick="downloadQR()">⬇️ QR Image Download</button></div></div><script>let qr;async function init(){let s={};try{s=await fetch('/api/public-settings').then(r=>r.json())}catch(e){}document.getElementById('brandText').textContent=s.business_name||'PrintPay';if(s.logo_url)document.getElementById('logo').src=s.logo_url;qr=new QRCode(document.getElementById('qr'),{text:location.origin+'/',width:320,height:320});}function downloadQR(){const c=document.querySelector('#qr canvas');if(!c)return;const a=document.createElement('a');a.download='PrintPay-Customer-QR.png';a.href=c.toDataURL('image/png');a.click()}init();</script></body></html>

# Do not deploy this file directly.
# Workers Builds deploy command should be: node deploy.mjs
# deploy.mjs finds the existing D1 database named printpay-db and generates
# wrangler.generated.toml with the real database_id before deploying.
name = "printpay"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*"]


[[durable_objects.bindings]]
name = "PRINT_ROOMS"
class_name = "PrintRoom"
script_name = "printpay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrintRoom"]

name = "printpay-production"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*"]

[secrets]
required = ["ADMIN_INITIAL_PASSWORD", "SESSION_SECRET"]

[[d1_databases]]
binding = "DB"
database_name = "printpay-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[durable_objects.bindings]]
name = "PRINT_ROOMS"
class_name = "PrintRoom"
script_name = "printpay-production"

[[migrations]]
tag = "v1"
new_classes = ["PrintRoom"]

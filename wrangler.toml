name = "printpay"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "printpay-db"
database_id = "f9e35aaa-b29c-425b-84d9-e67d83b40962"

[[durable_objects.bindings]]
name = "PRINT_ROOM"
class_name = "PrintRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrintRoom"]

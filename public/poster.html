<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintPay Customer QR Poster</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{margin:0;background:#eef2ff;font-family:Arial,sans-serif}.poster{width:min(760px,92vw);margin:30px auto;background:white;border-radius:30px;padding:35px;text-align:center;box-shadow:0 15px 45px #0002}.brand{font-size:38px;font-weight:900;color:#4f46e5}.qr{margin:25px auto;width:320px;min-height:320px;display:grid;place-items:center}.qr img{width:320px}.steps{font-size:23px;font-weight:800;line-height:1.7}.small{color:#475569;font-size:17px}@media print{body{background:white}.poster{box-shadow:none;margin:0;width:auto}}button{padding:13px 22px;border:0;border-radius:12px;background:#4f46e5;color:white;font-weight:800;font-size:16px}</style></head><body><div class="poster"><div class="brand">🖨️ PrintPay</div><h1>নিজে নিজে Document Print করুন</h1><div id="qr" class="qr"></div><div class="steps">📱 ১. QR Scan করুন<br>📄 ২. নিজের Document / PDF Upload করুন<br>💵 ৩. Counter-এ Payment করুন<br>🖨️ ৪. Payment Received হলে Print হবে</div><p class="small">আপনার মোবাইল থেকেই কাজ করুন — দোকানের computer-এ Print Station আপনার file print করবে।</p><button onclick="window.print()">🖨️ Poster Print করুন</button></div><script>new QRCode(document.getElementById('qr'),{text:location.origin+'/',width:320,height:320});</script></body></html>
